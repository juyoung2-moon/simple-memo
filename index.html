<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>간단한 메모장</title>
<style>*{box-sizing:border-box}body{margin:24px auto;padding:0 16px;max-width:640px;background:white;color:#222;font:16px system-ui}section,li{border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0}input,textarea,button{font:inherit;padding:10px;max-width:100%}input,textarea{display:block;width:100%;margin:6px 0 12px;border:1px solid #aaa;border-radius:4px}button{cursor:pointer;margin:4px 6px 4px 0}button:disabled{cursor:wait}ul{padding:0;list-style:none}.content{white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:24px;overflow-wrap:anywhere}[hidden]{display:none!important}</style>
<h1>간단한 메모장</h1>
<p id="status" role="status" aria-live="polite">불러오는 중…</p>
<section id="auth" hidden><form id="loginForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><button type="submit">로그인</button><button id="signup" type="button">회원가입</button></form></section>
<section id="app" hidden><p id="account"></p><button id="logout">로그아웃</button><form id="memoForm"><label for="content">메모 내용</label><textarea id="content" rows="5" maxlength="10000" required></textarea><button type="submit">저장</button></form><ul id="list"></ul></section>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';
const db=createClient('https://wtgtbkcxcsgipbbmzfxa.supabase.co','sb_publishable__SJK05k14mju4rtRYDV5IA_D1snCQgi',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const el=id=>document.getElementById(id);let user=null,busy=false;
const status=t=>el('status').textContent=t;
async function run(message,fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);status(message);try{await fn()}catch(e){status('오류: '+(e.message||'잠시 후 다시 시도해 주세요.'))}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function list(){if(!user)return;const {data,error}=await db.from('memos').select('id,content,created_at').order('created_at',{ascending:false});if(error)throw error;el('list').replaceChildren();for(const memo of data){const li=document.createElement('li'),p=document.createElement('p'),b=document.createElement('button');p.className='content';p.textContent=memo.content;b.textContent='삭제';b.setAttribute('aria-label','메모 삭제');b.onclick=()=>run('삭제 중…',async()=>{const {error}=await db.from('memos').delete().eq('id',memo.id);if(error)throw error;await list();status('삭제했습니다.')});li.append(p,b);el('list').append(li)}if(!data.length){const li=document.createElement('li');li.textContent='저장된 메모가 없습니다.';el('list').append(li)}}
async function show(session){user=session?.user||null;el('auth').hidden=!!user;el('app').hidden=!user;el('list').replaceChildren();el('account').textContent=user?.email||'';if(user)await list();status(user?'':'로그인하거나 회원가입해 주세요.')}
async function sign(up){await run(up?'가입 중…':'로그인 중…',async()=>{const credentials={email:el('email').value.trim(),password:el('password').value};const {data,error}=up?await db.auth.signUp(credentials):await db.auth.signInWithPassword(credentials);if(error)throw error;el('password').value='';await show(data.session);if(up&&!data.session)status('이메일 확인이 필요합니다. 관리자에게 실습 인증 설정을 확인해 주세요.')})}
el('loginForm').onsubmit=e=>{e.preventDefault();sign(false)};el('signup').onclick=()=>{if(el('loginForm').reportValidity())sign(true)};
el('memoForm').onsubmit=e=>{e.preventDefault();const content=el('content').value.trim();if(!content){status('메모 내용을 입력해 주세요.');return}run('저장 중…',async()=>{if(!user)throw Error('로그인이 필요합니다.');const {error}=await db.from('memos').insert({user_id:user.id,content});if(error)throw error;el('content').value='';await list();status('저장했습니다.')})};
el('logout').onclick=()=>run('로그아웃 중…',async()=>{const {error}=await db.auth.signOut();if(error)throw error;el('content').value='';await show(null)});
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')void show(null);else if(event==='TOKEN_REFRESHED')user=session?.user||null});
try{const {data,error}=await db.auth.getSession();if(error)throw error;await show(data.session)}catch(e){el('auth').hidden=false;status('오류: '+e.message)}
</script></html>
